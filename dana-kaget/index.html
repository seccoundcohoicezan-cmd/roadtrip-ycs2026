<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klaim Dana Kaget — Youth Character Summit 2026</title>
  <meta name="description" content="Klaim Dana Kaget YCS 2026: isi identitas, masukkan kode akses dari panitia.">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=/#dana">
  <script>
    // Klaim Dana Kaget kini ada di beranda (#dana). Kode dari tautan lama ikut dibawa.
    (function () {
      var q = new URLSearchParams(location.search);
      var kode = q.get('kode');
      location.replace('/' + (kode ? '?kode=' + encodeURIComponent(kode) : '') + '#dana');
    })();
  </script>
</head>
<body>
  <p>Klaim Dana Kaget sudah pindah ke beranda. <a href="/#dana">Buka Klaim Dana Kaget</a>.</p>
</body>
</html>
