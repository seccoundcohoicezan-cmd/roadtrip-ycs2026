<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Festival Satu Kata — Layar YCS 2026</title>
  <meta name="description" content="Festival Satu Kata Youth Character Summit 2026: setiap warga adalah satu pelajar yang mengirim kata harapan.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@600;800&display=swap">
  <script>
    // Tanpa ?display=1 halaman ini mengarah ke Festival di beranda (isi data + kirim kata).
    if (new URLSearchParams(location.search).get('display') !== '1') location.replace('/#satu-kata');
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #082C33; font-family: "Plus Jakarta Sans", system-ui, sans-serif; overflow: hidden; }
    #panggung { position: fixed; inset: 0; }
    #panggung canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .info { position: fixed; left: 2vw; top: 2vh; z-index: 2; padding: 1vh 1.4vw; border-radius: 1.2vw; background: rgb(8 44 51 / .82); color: #fff; font-weight: 800; font-size: clamp(1rem, 1.6vw, 2rem); }
    .info strong { color: #FFC93C; font-size: 1.5em; }
    .ajak { position: fixed; right: 2vw; top: 2vh; z-index: 2; padding: 1vh 1.4vw; border-radius: 1.2vw; background: rgb(255 255 255 / .92); color: #082C33; font-weight: 800; font-size: clamp(.9rem, 1.3vw, 1.6rem); }
    .balon { position: absolute; z-index: 3; display: flex; gap: 1vw; align-items: center; padding: 1vh 1.4vw 1vh 1vh; border: .3vw solid #FFC93C; border-radius: 1.4vw; background: #FFFBF3; color: #13232A; box-shadow: 0 2vh 4vh -2vh rgb(0 0 0 / .5); transform: translate(-50%, calc(-100% - 2vh)) scale(.9); opacity: 0; transition: opacity 400ms ease, transform 400ms ease; }
    .balon.is-on { opacity: 1; transform: translate(-50%, calc(-100% - 2vh)); }
    .balon::after { content: ""; position: absolute; left: 50%; bottom: -1.3vh; width: 2vh; height: 2vh; background: #FFFBF3; border-right: .3vw solid #FFC93C; border-bottom: .3vw solid #FFC93C; transform: translateX(-50%) rotate(45deg); }
    .ava { width: 5vw; height: 5vw; border-radius: 50%; overflow: hidden; background: #FFD86B; }
    .ava canvas { width: 100%; height: 100%; display: block; }
    .balon strong { display: block; font-size: 1.6vw; }
    .balon em { display: block; font-family: "Permanent Marker", cursive; font-style: normal; font-size: 2.4vw; color: #C2410C; line-height: 1.1; }
    .balon small { display: block; font-size: 1vw; color: #4A5B62; }
  </style>
</head>
<body>
  <div id="panggung"><canvas id="kanvas" aria-hidden="true"></canvas>
    <div class="balon" id="balon"><span class="ava" id="ava"></span><span><strong id="nama"></strong><em id="kata"></em><small id="prov"></small></span></div>
  </div>
  <p class="info"><strong id="total">0</strong> warga festival</p>
  <p class="ajak">Masuk festival: roadtrip-ycs2026.vercel.app/#satu-kata</p>
  <script src="/assets/js/festival.js"></script>
  <script>
  (() => {
    'use strict';
    // Layar acara: festival penuh tanpa kunci, balon harapan bergantian satu per satu, data diperbarui tiap 30 detik.
    const nf = new Intl.NumberFormat('id-ID');
    const balon = document.getElementById('balon');
    let aktif = null;
    const fest = window.YCSFestival(document.getElementById('kanvas'), { gerakMinim: false, onFrame: () => posisi() });
    function posisi() {
      if (!aktif) return;
      const p = fest.posisi(aktif);
      if (!p) return;
      const bw = balon.offsetWidth;
      balon.style.left = Math.max(bw / 2 + 10, Math.min(p.W - bw / 2 - 10, p.x)) + 'px';
      balon.style.top = Math.max(balon.offsetHeight + 30, p.y) + 'px';
    }
    function giliran() {
      const list = fest.tampil;
      if (!list.length) return;
      const kandidat = list.slice(0, Math.max(10, Math.ceil(list.length * 0.6)));
      balon.classList.remove('is-on');
      setTimeout(() => {
        aktif = kandidat[Math.floor(Math.random() * kandidat.length)];
        fest.gambarAvatar(document.getElementById('ava'), aktif);
        document.getElementById('nama').textContent = aktif.n;
        document.getElementById('kata').textContent = aktif.k;
        document.getElementById('prov').textContent = aktif.p || '';
        fest.sorot(aktif, 3800);
        posisi();
        balon.classList.add('is-on');
      }, 420);
    }
    async function muat() {
      try {
        const d = await (await fetch('/api/kata', { cache: 'no-cache' })).json();
        if (!d.ok) return;
        fest.setWarga((d.orang || []).map(([n, k, p]) => ({ n, k, p })));
        document.getElementById('total').textContent = nf.format(d.total || 0);
      } catch (e) { /* coba lagi */ }
    }
    muat();
    setInterval(muat, 30000);
    setInterval(giliran, 4000);
  })();
  </script>
</body>
</html>
