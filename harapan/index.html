<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Satu Kata untuk Indonesia — Layar YCS 2026</title>
  <meta name="description" content="Awan kata Satu Kata untuk Indonesia, Youth Character Summit 2026.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@600;800&display=swap">
  <script>
    // Tanpa ?display=1 halaman ini mengarah ke kampanye di beranda (kirim kata + buka hasil).
    if (new URLSearchParams(location.search).get('display') !== '1') location.replace('/#satu-kata');
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; padding: 3vh 4vw; font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: #fff;
      background: radial-gradient(circle at 20% 10%, #C8102E, transparent 55%), radial-gradient(circle at 90% 90%, #E0571F, transparent 50%), #5B0A16; overflow: hidden; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 2vw; }
    h1 { margin: 0; font-family: "Permanent Marker", cursive; font-weight: 400; font-size: clamp(2rem, 4.5vw, 5rem); line-height: 1; }
    h1 span { color: #FFD86B; }
    .total { font-size: clamp(1rem, 1.8vw, 2rem); font-weight: 800; color: #FFE9EC; white-space: nowrap; }
    .total strong { color: #FFD86B; font-size: 1.6em; }
    #awan { display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: .3vw 1.6vw; padding: 2vh 0; font-weight: 800; line-height: 1; }
    #awan span { transition: font-size 600ms ease; }
    #awan span:nth-child(3n) { color: #FFD86B; }
    #awan span:nth-child(3n+2) { color: #FFC2CB; }
    footer { display: flex; justify-content: space-between; font-size: clamp(.9rem, 1.4vw, 1.5rem); font-weight: 600; color: #FFE9EC; }
    @media (prefers-reduced-motion: reduce) { #awan span { transition: none; } }
  </style>
</head>
<body>
  <header>
    <h1>Satu Kata <span>untuk Indonesia</span></h1>
    <p class="total"><strong id="total">–</strong> kata</p>
  </header>
  <main id="awan" aria-live="off"></main>
  <footer><span>Youth Character Summit 2026</span><span>Kirim katamu: roadtrip-ycs2026.vercel.app/#satu-kata</span></footer>
  <script>
  (() => {
    'use strict';
    const nf = new Intl.NumberFormat('id-ID');
    // Layar acara: awan kata penuh tanpa kunci, diperbarui tiap 30 detik.
    async function muat() {
      try {
        const d = await (await fetch('/api/kata', { cache: 'no-cache' })).json();
        if (!d.ok) return;
        document.getElementById('total').textContent = nf.format(d.total || 0);
        const list = (d.kata || []).slice(0, 120);
        const max = Math.max(1, ...list.map((x) => x[1])), min = Math.min(...list.map((x) => x[1]), max);
        const box = document.getElementById('awan');
        box.textContent = '';
        list.map((x, i) => [x, (i * 7919) % 127]).sort((a, b) => a[1] - b[1]).forEach(([[k, n]]) => {
          const t = max === min ? .5 : (Math.sqrt(n) - Math.sqrt(min)) / (Math.sqrt(max) - Math.sqrt(min));
          const sp = document.createElement('span');
          sp.style.fontSize = (1.4 + t * 5.6).toFixed(2) + 'vw';
          sp.textContent = k;
          box.append(sp);
        });
      } catch (e) { /* coba lagi pada putaran berikutnya */ }
    }
    muat();
    setInterval(muat, 30000);
  })();
  </script>
</body>
</html>
